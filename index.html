<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorama Pro - Adrian Goggins</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Poppins:wght@400;700&display=swap');

        :root {
            --bg-dark: #0f172a;
            --bg-light: #2e1065;
            --text-color: #ffffff;
            --accent: #06b6d4; /* Cian neón */
            --card-back: linear-gradient(135deg, #4c1d95, #1e1b4b);
            --card-border: #8b5cf6;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark), var(--bg-light));
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* AQUÍ ESTÁ EL ARREGLO: Permitimos el desplazamiento vertical */
            overflow-y: auto; 
            overflow-x: hidden;
        }

        /* --- PANTALLAS --- */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 500px;
            padding: 40px 20px; /* Añadí espacio arriba y abajo */
            box-sizing: border-box;
            text-align: center;
            margin: auto; /* Centra el contenido si hay espacio de sobra */
        }
        .screen.active { display: flex; }

        /* --- PANTALLA DE INICIO --- */
        h1 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 42px;
            margin: 0;
            color: var(--accent);
            text-shadow: 0 0 15px var(--accent);
        }
        .subtitle { color: #cbd5e1; font-size: 14px; margin-bottom: 30px; letter-spacing: 2px;}

        input[type="text"] {
            width: 80%;
            padding: 15px;
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid var(--card-border);
            border-radius: 10px;
            color: white;
            font-family: 'Share Tech Mono', monospace;
            font-size: 18px;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }
        input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }

        .btn-main {
            background: transparent;
            color: var(--accent);
            border: 2px solid var(--accent);
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            font-family: 'Share Tech Mono', monospace;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            width: 80%;
            margin-bottom: 15px;
        }
        .btn-main:hover { background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }

        .btn-reset {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #475569;
            padding: 8px 15px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-reset:hover { color: #ef4444; border-color: #ef4444; }

        /* --- PANTALLA DE JUEGO --- */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 20px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 15px;
            color: var(--accent);
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--card-border);
        }
        
        .btn-small {
            background: rgba(255,255,255,0.1);
            color: white;
            border: 1px solid var(--card-border);
            padding: 8px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Share Tech Mono', monospace;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn-small:hover { background: var(--card-border); }

        #game-board {
            display: grid;
            gap: 10px;
            width: 100%;
            max-width: 420px;
            perspective: 1000px;
            margin-bottom: 20px;
        }

        /* --- CARTAS --- */
        .card {
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            transform-style: preserve-3d;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .card.flipped { transform: rotateY(180deg); }
        .card.matched { pointer-events: none; }
        .card.matched .card-front { border-color: #10b981; box-shadow: 0 0 15px #10b981; }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        
        .card-back {
            background: var(--card-back);
            border: 2px solid var(--card-border);
            color: rgba(255,255,255,0.3);
            font-size: 2rem;
            font-family: 'Share Tech Mono', monospace;
        }
        
        .card-front {
            background: #ffffff;
            transform: rotateY(180deg);
            border: 3px solid var(--accent);
            font-size: 3rem;
        }

        /* --- MENSAJE VICTORIA --- */
        #win-message {
            display: none;
            position: fixed; /* Cambiado a fixed para que no se mueva si hay scroll */
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid var(--accent);
            border-radius: 15px;
            padding: 30px;
            text-align: center;
            z-index: 100;
            box-shadow: 0 0 40px rgba(6, 182, 212, 0.4);
            width: 80%;
            max-width: 320px;
        }

        /* Botón flotante de donación */
        .donate-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0070ba;
            color: white;
            padding: 10px 15px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 1000;
        }
    </style>
</head>
<body>

    <a href="https://paypal.me/AdrianN413" target="_blank" class="donate-btn">Donar 💙</a>

    <!-- PANTALLA DE INICIO -->
    <div id="screen-home" class="screen active">
        <h1>MEMORAMA PRO</h1>
        <p class="subtitle">Desarrollado por Adrian Goggins</p>
        
        <input type="text" id="player-name" placeholder="Ingresa tu nombre" maxlength="15">
        <button class="btn-main" onclick="startGame()">Iniciar / Continuar</button>
        <button class="btn-reset" onclick="resetProgress()">Borrar Progreso Guardado</button>
    </div>

    <!-- PANTALLA DE JUEGO -->
    <div id="screen-game" class="screen">
        <div class="top-bar">
            <div>Jugador: <span id="display-name" style="color:white;"></span></div>
            <div>Nivel: <span id="level-display" style="color:#fbbf24;">1</span>/25</div>
            <div>Mov: <span id="moves-display" style="color:#fbbf24;">0</span></div>
        </div>
        
        <div id="game-board"></div>
        
        <button class="btn-small" onclick="goHome()">← Guardar y Salir</button>

        <div id="win-message">
            <h2 style="color: var(--accent); font-family: 'Share Tech Mono'; margin-top:0;">¡NIVEL COMPLETADO!</h2>
            <p style="font-size: 18px;">Tiempo: <span id="time-display" style="color:#fbbf24; font-weight:bold;">0</span>s</p>
            <button class="btn-main" style="width: 100%; margin-top: 10px; margin-bottom:0;" id="next-btn">Siguiente Nivel</button>
        </div>
    </div>

    <script>
        // --- CONFIGURACIÓN DE 25 NIVELES ---
        const baseEmojis = ["🐎", "🏇", "🦄", "🐴", "😀", "😂", "😎", "😍", "😡", "🥶", "🍎", "🍌", "🍇", "🍉", "🍓", "🍒", "🍍", "🥝", "🐶", "🐱", "🐭", "🐹", "🐰", "🦊", "🚗", "🚕", "🚙", "🚌", "🚎", "🏎️", "🚓", "🚑"];
        const levels = [];
        
        for (let i = 1; i <= 25; i++) {
            let numPairs = Math.min(2 + Math.floor(i / 2), 12); 
            let cols = 2;
            if (numPairs > 2 && numPairs <= 4) cols = 2;
            if (numPairs > 4 && numPairs <= 6) cols = 3;
            if (numPairs > 6 && numPairs <= 12) cols = 4;
            
            levels.push({
                id: i,
                pairs: numPairs,
                cols: cols,
                showTime: i >= 15 ? 3000 : 0 
            });
        }

        let currentLevelIndex = 0;
        let playerName = "";
        let cards = [];
        let flippedCards = [];
        let matchedPairs = 0;
        let moves = 0;
        let lockBoard = false;
        let timerInterval;
        let secondsElapsed = 0;

        const board = document.getElementById('game-board');
        const levelDisplay = document.getElementById('level-display');
        const movesDisplay = document.getElementById('moves-display');
        const winMessage = document.getElementById('win-message');
        const timeDisplay = document.getElementById('time-display');
        const nameInput = document.getElementById('player-name');

        function saveProgress() {
            const progress = { name: playerName, level: currentLevelIndex };
            localStorage.setItem('memoramaProgress', JSON.stringify(progress));
        }

        function loadProgress() {
            const saved = localStorage.getItem('memoramaProgress');
            if (saved) {
                const progress = JSON.parse(saved);
                nameInput.value = progress.name; 
            }
        }

        function resetProgress() {
            if(confirm("¿Seguro que quieres borrar tu progreso y empezar desde el Nivel 1?")) {
                localStorage.removeItem('memoramaProgress');
                nameInput.value = "";
                alert("Progreso borrado.");
            }
        }

        window.onload = loadProgress;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function startGame() {
            let inputName = nameInput.value.trim();
            if (inputName === "") {
                alert("Por favor, ingresa tu nombre para jugar.");
                return;
            }
            playerName = inputName;
            document.getElementById('display-name').textContent = playerName;

            const saved = localStorage.getItem('memoramaProgress');
            if (saved) {
                const progress = JSON.parse(saved);
                if (progress.name === playerName && progress.level > 0) {
                    if (confirm(`¡Hola de nuevo ${playerName}! Encontramos que llegaste al Nivel ${progress.level + 1}. ¿Quieres continuar desde ahí?`)) {
                        currentLevelIndex = progress.level;
                    } else {
                        currentLevelIndex = 0;
                    }
                } else {
                    currentLevelIndex = 0;
                }
            } else {
                currentLevelIndex = 0;
            }

            showScreen('screen-game');
            initLevel();
        }

        function goHome() {
            clearInterval(timerInterval);
            saveProgress();
            showScreen('screen-home');
        }

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function initLevel() {
            const level = levels[currentLevelIndex];
            levelDisplay.textContent = level.id;
            moves = 0;
            movesDisplay.textContent = moves;
            matchedPairs = 0;
            flippedCards = [];
            lockBoard = true; 
            winMessage.style.display = 'none';
            board.innerHTML = '';
            secondsElapsed = 0;
            timeDisplay.textContent = secondsElapsed;

            board.style.gridTemplateColumns = `repeat(${level.cols}, 1fr)`;

            let selectedEmojis = shuffle([...baseEmojis]).slice(0, level.pairs);
            let gameEmojis = [...selectedEmojis, ...selectedEmojis];
            cards = shuffle(gameEmojis);

            cards.forEach((emoji) => {
                const card = document.createElement('div');
                card.classList.add('card');
                card.dataset.emoji = emoji;
                
                card.innerHTML = `
                    <div class="card-face card-back">?</div>
                    <div class="card-face card-front">${emoji}</div>
                `;
                board.appendChild(card);
            });

            if (level.showTime > 0) {
                const allCards = board.querySelectorAll('.card');
                allCards.forEach(c => c.classList.add('flipped'));
                
                setTimeout(() => {
                    allCards.forEach(c => c.classList.remove('flipped'));
                    setTimeout(() => {
                        lockBoard = false;
                        startTimer();
                        allCards.forEach(c => c.addEventListener('click', () => flipCard(c)));
                    }, 400);
                }, level.showTime);
            } else {
                lockBoard = false;
                startTimer();
                board.querySelectorAll('.card').forEach(c => {
                    c.addEventListener('click', () => flipCard(c));
                });
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                timeDisplay.textContent = secondsElapsed;
            }, 1000);
        }

        function flipCard(card) {
            if (lockBoard) return;
            if (card === flippedCards[0]) return;
            if (card.classList.contains('flipped')) return;

            card.classList.add('flipped');
            flippedCards.push(card);

            if (flippedCards.length === 2) {
                moves++;
                movesDisplay.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.emoji === card2.dataset.emoji;

            if (isMatch) {
                card1.classList.add('matched');
                card2.classList.add('matched');
                matchedPairs++;
                flippedCards = [];

                const totalPairs = levels[currentLevelIndex].pairs;
                if (matchedPairs === totalPairs) {
                    clearInterval(timerInterval);
                    setTimeout(() => {
                        if (currentLevelIndex < levels.length - 1) {
                            winMessage.style.display = 'block';
                        } else {
                            localStorage.removeItem('memoramaProgress');
                            winMessage.innerHTML = `
                                <h2 style="color: var(--accent); font-family: 'Share Tech Mono';">¡JUEGO COMPLETADO!</h2>
                                <p>Has superado los 25 niveles. Eres una leyenda.</p>
                                <button class="btn-main" style="width: 100%; margin-top: 15px;" onclick="location.reload()">Volver a Jugar</button>
                            `;
                            winMessage.style.display = 'block';
                        }
                    }, 500);
                }
            } else {
                lockBoard = true;
                setTimeout(() => {
                    card1.classList.remove('flipped');
                    card2.classList.remove('flipped');
                    flippedCards = [];
                    lockBoard = false;
                }, 1000);
            }
        }

        document.getElementById('next-btn').addEventListener('click', () => {
            currentLevelIndex++;
            saveProgress();
            initLevel();
        });
    </script>
</body>
</html>
